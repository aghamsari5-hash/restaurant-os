name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

jobs:
  # ── Backend ──────────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: restaurantos
          POSTGRES_PASSWORD: restaurantos
          POSTGRES_DB: restaurantos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Prisma validate
        working-directory: backend
        run: npx prisma validate

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Tests
        working-directory: backend
        run: npm run test
        env:
          DATABASE_URL: postgresql://restaurantos:restaurantos@localhost:5432/restaurantos_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-min-32-chars-long
          JWT_REFRESH_SECRET: test-refresh-secret-min-32-chars

      - name: Security check
        run: node .ai/scripts/check-security.mjs --path backend/src
        continue-on-error: true

  # ── Frontend ─────────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Token compliance
        run: node .ai/scripts/validate-tokens.mjs --path frontend/src
        continue-on-error: true

  # ── Traceability ─────────────────────────────────────────
  traceability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check traceability
        run: node .ai/scripts/check-traceability.mjs --all
        continue-on-error: true

  # ── Docker ───────────────────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Build and start
        run: docker compose up --build -d

      - name: Wait for services
        run: sleep 15

      - name: Health check
        run: curl -f http://localhost:3001/health || (docker compose logs && exit 1)

      - name: Swagger check
        run: curl -f http://localhost:3001/api/docs || echo "Swagger not yet available"

      - name: Cleanup
        if: always()
        run: docker compose down -v
